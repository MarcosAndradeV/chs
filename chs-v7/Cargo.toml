[workspace]
members = [
    "cli",
    "codegen",
    "compiler",
    "diagnostic",
    "ir",
    "semantics",
    "syntax",
    "types"
]

resolver = "2"

[workspace.package]
version = "0.0.1"
authors = ["Marcos Vinicius Andrade"]

[workspace.dependencies]
lex-just-parse = { version = "1.3.1", features = ["interning"] }
